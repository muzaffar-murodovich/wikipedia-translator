<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjimon</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>Tarjimon</h1>
    <div class="topbar-controls">
      <label class="switch-label">
        <input type="checkbox" id="review-toggle">
        Phase 5 (tahrir)
      </label>
      <a href="{{ url_for('localization_page') }}">Lokalizatsiya lugʻati</a>
    </div>
  </header>

  <main class="panels">
    <section class="panel">
      <h2>Inglizcha</h2>
      <textarea id="input-box" placeholder="https://en.wikipedia.org/wiki/... yoki maqola nomi yoki wikitext"></textarea>
      <button id="translate-btn">Tarjima qilish</button>
      <div id="progress" class="progress" hidden>
        <span id="progress-label">Boshlanmoqda...</span>
      </div>
      <div id="error-box" class="error-box" hidden></div>
    </section>

    <section class="panel">
      <h2>Oʻzbekcha tarjima</h2>
      <textarea id="output-box" readonly placeholder="Tarjima shu yerda koʻrinadi"></textarea>
      <div class="result-actions">
        <button id="copy-btn" disabled>Nusxalash</button>
        <a id="download-link" class="button-link disabled" href="#">Yuklab olish (.txt)</a>
      </div>
      <div id="stats-box" class="stats-box" hidden></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
